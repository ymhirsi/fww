<style>
*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,system-ui,-apple-system,sans-serif;color:#3d3158;background:linear-gradient(#efe3ff,#fff8f1);min-height:100dvh}button{font:inherit;touch-action:manipulation;cursor:pointer}main{max-width:800px;margin:auto;padding:14px 12px 35px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.top strong{font-size:clamp(16px,4vw,23px)}.pill{background:white;border:0;border-radius:22px;padding:10px 13px;color:#5b438b;font-weight:750;box-shadow:0 2px 8px #634e8620}.heading{text-align:center;margin:14px 0 6px;font-size:clamp(25px,6vw,37px)}.hint{text-align:center;margin:0 0 12px;font-size:14px;color:#746887}.world{position:relative;aspect-ratio:4/3;width:100%;overflow:hidden;border:5px solid #fff;border-radius:30px;background:#d9e7ff;box-shadow:0 14px 36px #7155a633;isolation:isolate;touch-action:manipulation}.sky{position:absolute;inset:0;background:linear-gradient(#bcdfff 0%,#e5edff 65%,#e8d4aa 65%)}.sun{position:absolute;top:8%;right:13%;width:12%;aspect-ratio:1;border-radius:50%;background:#fff0ad;box-shadow:0 0 0 12px #fff4c15e}.cloud{position:absolute;top:12%;left:12%;font-size:clamp(32px,8vw,65px);opacity:.9}.hill{position:absolute;bottom:15%;width:95%;height:43%;border-radius:50% 50% 0 0;background:#a5d9b3}.hill.a{left:-35%}.hill.b{right:-40%;background:#8bc99e}.floor{position:absolute;bottom:0;left:0;width:100%;height:28%;background:#c5dfac;border-top:8px solid #acd08f}.house{position:absolute;left:21%;top:22%;width:57%;height:53%;background:#fff2d9;border:6px solid #f4cfb4;border-radius:12px}.roof{position:absolute;left:17%;top:9%;width:66%;height:22%;background:#a986d2;clip-path:polygon(50% 0,100% 100%,0 100%)}.door{position:absolute;left:43%;bottom:0;width:19%;height:54%;background:#9e79bb;border-radius:50% 50% 0 0;border:5px solid #8060a1}.window{position:absolute;top:23%;width:20%;height:30%;background:#a9d9e7;border:6px solid white;border-radius:12px}.window.left{left:10%}.window.right{right:10%}.roomwall{position:absolute;inset:0 0 25%;background:linear-gradient(#fceaf9,#fff4df)}.roomwall:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 60px,#ffffff60 60px 63px)}.roomfloor{position:absolute;bottom:0;width:100%;height:27%;background:repeating-linear-gradient(90deg,#d6b38f 0 65px,#dfc09e 65px 69px)}.rug{position:absolute;bottom:6%;left:19%;width:62%;height:18%;border-radius:50%;background:#cdb5e9;border:5px solid #e8dcf5}.sceneItem{position:absolute;border:0;background:transparent;padding:0;display:flex;align-items:center;flex-direction:column;justify-content:center;transform:translate(-50%,-50%);z-index:2;min-width:64px;min-height:62px}.sceneItem .emoji{font-size:clamp(35px,9vw,78px);filter:drop-shadow(0 5px 3px #5e486433);transition:transform .2s}.sceneItem:active .emoji{transform:scale(1.17)}.sceneItem .name{font-size:clamp(10px,2.4vw,14px);font-weight:800;background:#fffdf5ed;border-radius:12px;padding:3px 7px;white-space:nowrap}.faya{position:absolute;left:50%;top:81%;transform:translate(-50%,-85%);z-index:5;pointer-events:none;transition:left .65s ease,top .65s ease;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 4px 3px #6b52744a)}.faya .face{font-size:clamp(38px,9vw,68px)}.faya .label{font-size:12px;font-weight:800;background:#fff;border-radius:12px;padding:1px 8px}.bubble{background:#fff;border-radius:22px;padding:15px 17px;min-height:62px;margin:14px 0 10px;box-shadow:0 3px 15px #6c559b19;text-align:center;font-size:18px;font-weight:700}.nav{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}.nav button{background:#7655b1;color:white;border:0;border-radius:20px;padding:13px 17px;font-weight:800;min-height:50px}.nav button.active{background:#4d317d}.music{background:#fffdfd;border-radius:22px;padding:13px;margin:10px 0;text-align:center}.keys{display:flex;justify-content:center;gap:3px}.key{height:95px;flex:1;max-width:70px;border:2px solid #897ba1;borde </style></head><body><main><header class="top"><strong>💜 Faya's Wonder World</strong><button class="pill" id="sound" aria-pressed="true">🔊 Sound on</button></header><h1 class="heading" id="title">Faya's Garden</h1><p class="hint">Tap anywhere to walk. Tap objects to discover!</p><div class="world" id="world" aria-label="Interactive exploration scene"><div id="scenery"></div><div id="items"></div><div class="faya" id="faya"><span class="face">👧🏽</span><span class="label">Faya</span></div></div><div class="bubble" id="bubble" role="status" aria-live="polite">Welcome, Faya! Tap the door to go inside. 🏡</div><section class="music hidden" id="music"><strong>🎹 Play the piano!</strong><p class="hint">Touch a key to hear a note.</p><div class="keys" id="keys"></div></section><nav class="nav" id="nav" aria-label="Places"><button data-go="garden">🌷 Garden</button><button data-go="living">🛋️ Living room</button><button data-go="bedroom">🧸 Bedroom</button><button data-go="kitchen">🍎 Kitchen</button></nav><p class="foot">Explore together • No quizzes, ads, or tracking • Parent tip: find the same objects around your home!</p></main>
<script>

let current="garden",audio=null,muted=false,travelTimer=null;const $=id=>document.getElementById(id);function note(freq,duration=.35){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type="sine";o.frequency.value=freq;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.16,audio.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration+.03)}catch(e){}}function speak(t){if(muted||!("speechSynthesis" in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.83;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}}function message(t,voice=false){$("bubble").textContent=t;if(voice)speak(t)}function walk(x,y,callback){clearTimeout(travelTimer);$("faya").style.left=Math.max(8,Math.min(92,x))+"%";$("faya").style.top=Math.max(45,Math.min(88,y))+"%";if(callback)travelTimer=setTimeout(callback,680)}function render(id){clearTimeout(travelTimer);current=id;let s=scenes[id];$("title").textContent=s.title;$("music").classList.add("hidden");$("scenery").innerHTML=s.type==="outside"?'<div class="sky"></div><div class="sun"></div><div class="cloud">☁️</div><div class="hill a"></div><div class="hill b"></div><div class="floor"></div><div class="house"><div class="door"></div><div class="window left"></div><div class="window right"></div></div><div class="roof"></div>':'<div class="roomwall"></div><div class="roomfloor"></div><div class="rug"></div>';$("items").replaceChildren();s.items.forEach(item=>{let b=document.createElement("button");b.className="sceneItem";b.style.left=item.x+"%";b.style.top=item.y+"%";b.setAttribute("aria-label",item.name);b.innerHTML='<span class="emoji"></span><span class="name"></span>';b.querySelector(".emoji").textContent=item.emoji;b.querySelector(".name").textContent=item.name;b.onclick=e=>{e.stopPropagation();walk(item.x,item.y+10,()=>{if(item.to){render(item.to);note(659)}else{message(item.say,true);if(item.sound)note(item.sound);if(item.piano)$("music").classList.remove("hidden")}})};$("items").append(b)});walk(...s.start);message(s.message);document.querySelectorAll("[data-go]").forEach(b=>b.classList.toggle("active",b.dataset.go===id))}document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{render(b.dataset.go);note(523)});$("world").addEventListener("click",e=>{if(e.target.closest(".sceneItem"))return;let r=$("world").getBoundingClientRect();walk((e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100);message("Here I come! 👣")});$("sound").onclick=()=>{muted=!muted;$("sound").textContent=muted?"🔇 Sound off":"🔊 Sound on";$("sound").setAttribute("aria-pressed",String(!muted));if(muted&&"speechSynthesis" in window)speechSynthesis.cancel()};[261.63,293.66,329.63,349.23,392,440,493.88,523.25].forEach((f,i)=>{let b=document.createElement("button");b.className="key";b.textContent=["C","D","E","F","G","A","B","C"][i];b.setAttribute("aria-label","Play note "+b.textContent);b.onclick=()=>{note(f,.6);b.classList.add("playing");setTimeout(()=>b.classList.remove("playing"),220)};$("keys").append(b)});render("garden");
</script></body></html>

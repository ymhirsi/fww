<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eadcf8"><meta name="apple-mobile-web-app-capable" content="yes"><title>Faya's Wonder World</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4edff;color:#47365d;font-family:ui-rounded,system-ui,-apple-system,sans-serif}main{max-width:860px;margin:auto;padding:12px 12px 30px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}header b{font-size:clamp(16px,4vw,24px)}button{font:inherit;cursor:pointer;touch-action:manipulation}.small{border:0;background:#fff;border-radius:25px;padding:11px 14px;color:#604d81;font-weight:800}h1{text-align:center;margin:12px 0 4px;font-size:clamp(24px,6vw,34px)}.help{text-align:center;margin:0 0 12px;color:#80738f;font-size:14px}.frame{border:6px solid #fff;border-radius:26px;overflow:hidden;box-shadow:0 15px 30px #7156a22c;background:#d9ebf8}svg{display:block;width:100%;height:auto;touch-action:manipulation}svg .object{cursor:pointer;outline:none}svg .object:focus-visible{filter:drop-shadow(0 0 7px #a16eff)}svg .object:hover .spark{opacity:1}.spark{opacity:0;pointer-events:none}#avatar{pointer-events:none;transition:transform .8s ease}#avatar.walking .legL{animation:step .24s infinite alternate}#avatar.walking .legR{animation:step .24s infinite alternate-reverse}@keyframes step{to{transform:rotate(16deg)}}.message{background:#fff;border-radius:20px;margin:13px 0;padding:14px 18px;min-height:56px;text-align:center;font-size:17px;font-weight:700;box-shadow:0 3px 12px #654f911a}.places{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.places button{border:0;border-radius:18px;padding:12px 14px;background:#e0d0f5;color:#503a75;font-weight:800}.places button.active{background:#7353ad;color:white}.piano{background:#fff;border-radius:20px;padding:15px;margin:10px 0;text-align:center}.piano[hidden]{display:none}.keys{display:flex;justify-content:center;margin-top:12px}.key{height:95px;flex:1;max-width:75px;background:white;border:2px solid #8d7b9f;border-radius:0 0 9px 9px;padding-top:55px}.key:active{background:#d3bbf6}.foot{text-align:center;color:#87798d;font-size:12px;margin-top:20px}@media(prefers-reduced-motion:reduce){#avatar{transition:none}.legL,.legR{animation:none!important}}</style></head><body><main><header><b>💜 Faya's Wonder World</b><button class="small" id="sound">🔊 Sound on</button></header><h1 id="heading">Faya's Garden</h1><p class="help">Tap to walk • Tap a door to enter • Touch things to discover</p><div class="frame"><svg id="world" viewBox="0 0 800 520" role="application" aria-label="Faya's explorable illustrated world"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#b7defa"/><stop offset="1" stop-color="#f9eddf"/></linearGradient><pattern id="floor" width="80" height="70" patternUnits="userSpaceOnUse"><rect width="80" height="70" fill="#e8caa8"/><path d="M0 0H80M40 0V70" stroke="#d8b68f" stroke-width="2"/></pattern></defs><g id="background"></g><g id="objects"></g><g id="avatar"><ellipse cx="0" cy="3" rx="25" ry="8" fill="#67547b" opacity=".18"/><g class="legL" transform="translate(-10 -12)"><path d="M0 0V13" stroke="#6d4d91" stroke-width="11" stroke-linecap="round"/></g><g class="legR" transform="translate(10 -12)"><path d="M0 0V13" stroke="#6d4d91" stroke-width="11" stroke-linecap="round"/></g><path d="M-22 -52Q0 -65 22 -52L20 -17Q0 -8 -20 -17Z" fill="#a781d1"/><path d="M-22 -50L-30 -28M22 -50L30 -28" stroke="#b97c5a" stroke-width="10" stroke-linecap="round"/><circle cy="-79" r="27" fill="#4b302a"/><circle cx="-20" cy="-95" r="12" fill="#4b302a"/><circle cx="20" cy="-95" r="12" fill="#4b302a"/><ellipse cy="-75" rx="23" ry="24" fill="#c88d6b"/><circle cx="-9" cy="-77" r="2.5" fill="#382c38"/><circle cx="9" cy="-77" r="2.5" fill="#382c38"/><path d="M-7 -64Q0 -58 7 -64" fill="none" stroke="#7b4350" stroke-width="2.5" stroke-linecap="round"/></g></svg></div><div class="message" id="message" role="status" aria-live="polite">Tap the front door to enter Faya's house!</div><div class="piano" id="piano" hidden><b>🎵 Faya's piano</b><div class="keys" id="keys"></div></div><nav class="places" id="places"><button data-room="garden">🌷 Garden</button><button data-room="living">🛋️ Living room</button><button data-room="bedroom">🧸 Bedroom</button><button data-room="kitchen">🍎 Kitchen</button></nav><p class="foot">A little world to explore together • No quizzes, ads or tracking</p></main><script>
const ns="http://www.w3.org/2000/svg",bg=document.getElementById("background"),objects=document.getElementById("objects"),avatar=document.getElementById("avatar"),msg=document.getElementById("message");let room="garden",pos={x:400,y:468},timer=null,muted=false,ctx=null;const shape=(tag,attrs={},parent=objects)=>{const n=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));parent.append(n);return n};const rect=(x,y,w,h,fill,rx=0,parent=bg)=>shape("rect",{x,y,width:w,height:h,fill,rx},parent);const ellipse=(cx,cy,rx,ry,fill,parent=bg)=>shape("ellipse",{cx,cy,rx,ry,fill},parent);const path=(d,fill,stroke="none",sw=1,parent=bg)=>shape("path",{d,fill,stroke,"stroke-width":sw,"stroke-linejoin":"round"},parent);function label(x,y,t,p=objects){const e=shape("text",{x,y,"text-anchor":"middle","font-size":17,"font-weight":800,fill:"#5b4274",stroke:"#fff","stroke-width":4,"paint-order":"stroke"},p);e.textContent=t;return e}function item(name,x,y,draw,action){let g=shape("g",{class:"object",role:"button",tabindex:"0","aria-label":name});draw(g);const run=e=>{e.stopPropagation();move(x,y+40,()=>action())};g.addEventListener("click",run);g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();run(e)}});return g}function say(text,sound=null){msg.textContent=text;if(!muted&&"speechSynthesis" in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.rate=.82;u.pitch=1.12;speechSynthesis.speak(u)}if(sound)tone(sound)}function tone(f){if(muted)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.15,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.55);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.6)}catch(e){}}function move(x,y,after){clearTimeout(timer);pos={x:Math.max(45,Math.min(755,x)),y:Math.max(330,Math.min(485,y))};avatar.classList.add("walking");avatar.setAttribute("transform",`translate(${pos.x} ${pos.y})`);timer=setTimeout(()=>{avatar.classList.remove("walking");if(after)after()},820)}function house(){rect(0,0,800,520,"url(#sky)");ellipse(110,430,330,165,"#a6d9b3");ellipse(720,435,390,185,"#8bc9a2");rect(0,405,800,115,"#b5d997");ellipse(400,493,210,65,"#e9d4a8");path("M150 205L400 55 650 205Z","#9a76bf");rect(184,198,432,230,"#fff0d7",16);rect(196,210,408,210,"none",14);path("M380 427V315Q400 281 420 315V427Z","#8d66ac");ellipse(410,366,4,4,"#fce1a2");[245,510].forEach(x=>{rect(x,260,80,87,"#fff",12);rect(x+9,269,62,69,"#9ed9e9",7);path(`M${x+40} 269V338M${x+9} 302H${x+71}`,"none","#fff",5)});for(let i=0;i<8;i++){let x=30+i*110;ellipse(x,450,19,13,i%2?"#e9a4ce":"#ab8cda");ellipse(x,429,10,18,i%2?"#f1c1dd":"#cfb6ee")}item("Front door",400,356,g=>{rect(365,306,70,120,"#9671b5",28,g);ellipse(420,371,4,4,"#ffe6a4",g);label(400,296,"Go inside",g)},()=>render("living"));item("Purple flowers",85,420,g=>{path("M85 425V375","none","#568b5b",5,g);for(let a=0;a<5;a++){let ang=a*Math.PI*2/5;ellipse(85+Math.cos(ang)*13,370+Math.sin(ang)*13,11,13,"#a27bd4",g)}ellipse(85,370,9,9,"#ffdf8d",g)},()=>say("Purple flowers! بنفسجي",523));item("Butterfly",685,330,g=>{ellipse(670,320,22,16,"#f7b5d4",g);ellipse(700,320,22,16,"#d8b2f4",g);ellipse(685,331,5,22,"#8763a0",g)},()=>say("Hello, butterfly! فراشة",784));item("Tree",735,410,g=>{rect(722,290,25,126,"#a47b60",8,g);ellipse(735,277,69,65,"#7cba83",g);ellipse(704,270,34,34,"#a4d3a3",g)},()=>say("A big green tree! شجرة",392))}
function indoor(){rect(0,0,800,385,room==="bedroom"?"#f5e4f6":room==="kitchen"?"#f9e8d6":"#f8e8ed");rect(0,385,800,135,"url(#floor)");rect(50,80,165,200,"#fff8f2",16);rect(63,93,139,174,"#b5e1ef",12);path("M133 93V267M63 180H202","none","#fff",11);ellipse(133,253,62,17,"#a2cfad");ellipse(420,450,270,46,"#d8c1e9")}
function living(){indoor();item("Piano",290,300,g=>{rect(160,235,250,106,"#72528f",12,g);rect(177,275,215,50,"#fff",5,g);for(let i=0;i<8;i++)rect(181+i*26,276,24,47,"#fefaf4",2,g);for(let i of [0,1,3,4,5])rect(198+i*26,276,14,29,"#44344f",2,g);rect(170,333,16,83,"#6e508b",3,g);rect(385,333,16,83,"#6e508b",3,g);label(288,223,"Piano",g)},()=>{say("Let's play the piano! 🎵");document.getElementById("piano").hidden=false});item("Sofa",620,350,g=>{rect(490,290,250,100,"#a9c9bd",25,g);rect(505,320,220,72,"#8fb8a9",16,g);rect(485,325,30,67,"#8fb8a9",13,g);rect(720,325,30,67,"#8fb8a9",13,g);label(615,280,"Cozy sofa",g)},()=>say("A soft sofa! Can you find something soft?"));item("Violin",670,170,g=>{ellipse(670,155,19,32,"#c9894e",g);ellipse(670,183,24,27,"#c9894e",g);rect(665,99,10,55,"#a46a40",4,g);path("M660 174H680","none","#f9e4b6",2,g);label(670,230,"Violin",g)},()=>say("A violin! كمان",659));door(65,385,"Garden","garden");door(765,385,"Bedroom","bedroom");door(420,385,"Kitchen","kitchen")}

function bedroom(){indoor();item("Bed",305,355,g=>{rect(145,310,330,100,"#d8b3df",17,g);rect(165,292,120,44,"#fffaf3",18,g);rect(285,310,180,80,"#c9a1dc",15,g);label(300,278,"Bed",g)},()=>say("A cozy bed. Good night!"));item("Teddy bear",625,338,g=>{ellipse(620,348,53,63,"#bb8b64",g);ellipse(585,283,22,22,"#bb8b64",g);ellipse(655,283,22,22,"#bb8b64",g);ellipse(620,295,42,38,"#cda17b",g);ellipse(606,288,4,4,"#42333a",g);ellipse(635,288,4,4,"#42333a",g);ellipse(620,302,7,5,"#694a45",g);label(625,418,"Teddy",g)},()=>say("Hello, teddy bear! دبدوب",440));item("Moon",460,140,g=>{ellipse(460,135,47,47,"#f8d8a1",g);ellipse(478,119,42,42,"#f5e4f6",g)},()=>say("The moon! قمر",587));door(75,385,"Living room","living")}
function kitchen(){indoor();rect(235,290,350,105,"#c7d8b9",15);rect(250,278,320,22,"#fdf8e7",6);item("Apple",300,270,g=>{ellipse(300,251,32,30,"#e87e81",g);path("M300 226L307 212","none","#6f8253",5,g);ellipse(316,221,14,6,"#91b878",g);label(300,202,"Apple",g)},()=>say("Red apple! تفاحة",523));item("Banana",435,270,g=>{path("M397 240Q432 300 481 239Q445 273 397 240Z","#f3ce66","#d9ad4e",3,g);label(435,215,"Banana",g)},()=>say("Yellow banana! موزة",587));item("Carrot",570,260,g=>{path("M547 236L585 236 565 297Z","#ee9b57", "#e18d48",3,g);path("M565 236L556 214M565 236L576 214","none","#82a96e",7,g)},()=>say("Orange carrot! جزرة"));door(75,385,"Living room","living")}
function render(id){clearTimeout(timer);room=id;bg.replaceChildren();objects.replaceChildren();document.getElementById("heading").textContent={garden:"Faya's Garden",living:"The Living Room",bedroom:"Faya's Bedroom",kitchen:"Faya's Kitchen"}[id];document.getElementById("piano").hidden=true;if(id==="garden")house();if(id==="living")living();if(id==="bedroom")bedroom();if(id==="kitchen")kitchen();avatar.setAttribute("transform","translate(400 475)");pos={x:400,y:475};msg.textContent=id==="garden"?"Tap the front door to go inside!":"Explore the room. Touch something you like!";document.querySelectorAll("[data-room]").forEach(b=>b.classList.toggle("active",b.dataset.room===id))}
document.getElementById("world").addEventListener("click",e=>{if(e.target.closest(".object"))return;let r=e.currentTarget.getBoundingClientRect();let x=(e.clientX-r.left)/r.width*800,y=(e.clientY-r.top)/r.height*520;move(x,y)});document.querySelectorAll("[data-room]").forEach(b=>b.onclick=()=>render(b.dataset.room));document.getElementById("sound").onclick=()=>{muted=!muted;document.getElementById("sound").textContent=muted?"🔇 Sound off":"🔊 Sound on";if(muted&&"speechSynthesis" in window)speechSynthesis.cancel()};[261.63,293.66,329.63,349.23,392,440,493.88,523.25].forEach((f,i)=>{let b=document.createElement("button");b.className="key";b.textContent=["C","D","E","F","G","A","B","C"][i];b.onclick=()=>tone(f);document.getElementById("keys").append(b)});render("garden");
</script></body></html>

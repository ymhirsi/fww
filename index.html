<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a7d9cc"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><title>Faya's Wonder World</title><link rel="stylesheet" href="style.css"></head><body>
<main id="game"><svg id="world" viewBox="0 0 1200 650" preserveAspectRatio="xMidYMid slice" role="application" aria-label="Faya's Wonder World. Tap the ground to walk. Tap objects to play."><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#9ddcde"/><stop offset="1" stop-color="#f9f0c6"/></linearGradient><pattern id="wallpaper" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M22 15v14m-7-7h14" stroke="#fff" opacity=".2" stroke-width="2"/></pattern><pattern id="wood" width="150" height="55" patternUnits="userSpaceOnUse"><rect width="150" height="55" fill="#eac399"/><path d="M0 0h150M0 0v55m15-18h45m40-20h30" stroke="#d7ab7e" stroke-width="2"/></pattern></defs><g id="scene"></g><g id="actor"></g><g id="effects" pointer-events="none"></g></svg>
<header><div class="location"><span class="flower">✿</span><div><small>FAYA'S WONDER WORLD</small><strong id="roomName">The garden</strong></div></div><div class="controls"><button id="language" aria-label="Change spoken language">EN / عربي</button><button id="sound" aria-label="Mute sound" aria-pressed="false">♫</button><button id="fullscreen" aria-label="Enter full screen">⛶</button></div></header>
<div id="caption" role="status"><span id="english">A little adventure starts at home.</span><span id="arabic" lang="ar" dir="rtl">مغامرة صغيرة تبدأ في البيت.</span></div>
<section id="piano" aria-label="Playable piano" hidden><div class="piano-head"><span>Make a little melody · <span lang="ar" dir="rtl">اعزفي لحناً</span></span><button id="closePiano" aria-label="Close piano">×</button></div><div id="keys"></div></section>
<div id="curtain"></div><div id="rotate"><span>↻</span><strong>Turn your phone to explore</strong><span lang="ar" dir="rtl">أديري الهاتف لنلعب</span></div>
</main><script src="game.js"></script></body></html>
